services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentinel-ai-backend:local
    env_file:
      - .env
    ports:
      - "5000:5000"
    environment:
      PCAP_RUN_FOLDER: /app/Backend/pcap_runs
      LOCAL_PCAP_ALLOWED_ROOT: /app/Backend/pcap_runs
    volumes:
      - backend-instance:/app/Backend/instance
      - backend-logs:/app/Backend/logs
      - backend-pcap-runs:/app/Backend/pcap_runs
      - backend-uploads:/app/upload

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-support@example.com}
    image: sentinel-ai-frontend:local
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend-instance:
  backend-logs:
  backend-pcap-runs:
  backend-uploads:
