# Sentinel AI local WAF rules.
# Audit logging intentionally uses minimal parts in main.conf to avoid logging
# Authorization headers, cookies, passwords, tokens, or raw request bodies.

SecAction "id:100000,phase:1,pass,nolog,initcol:ip=%{REMOTE_ADDR}"

# 1001: SQL Injection protection for login endpoints.
SecRule REQUEST_URI "@rx (?i)^/(?:api/auth/login|login|api/admin/auth/login)(?:$|[/?])" \
    "id:1001,phase:2,deny,status:403,log,msg:'Blocked SQL Injection attempt',chain"
    SecRule ARGS|REQUEST_BODY "@rx (?i)(?:\bor\b\s+['\"]?\d+['\"]?\s*=\s*['\"]?\d+|'\s*or\s*'1'\s*=\s*'1|union\s+select|--|/\*|\*/|sleep\s*\(|benchmark\s*\(|information_schema)"

# 1002: XSS protection for common script and event-handler payloads.
SecRule ARGS|REQUEST_BODY "@rx (?i)(?:<\s*script\b|<\s*/\s*script|javascript\s*:|onerror\s*=|onload\s*=|alert\s*\(|document\.cookie|srcdoc\s*=|<\s*iframe\b)" \
    "id:1002,phase:2,deny,status:403,log,msg:'Blocked XSS attempt'"

# 1003: Path traversal protection for file/report/download/export endpoints.
SecRule REQUEST_URI "@rx (?i)^/(?:download|api/files/download|api/documents/[^/]+/download|job/[^/]+/export|pcap/report/[^/]+|api/reports/monthly/[^/]+/download|api/admin/pcap/jobs/[^/]+/export)(?:$|[/?])" \
    "id:1003,phase:2,deny,status:403,log,msg:'Blocked Path Traversal attempt',chain"
    SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?i)(?:\.\./|\.\.\\|%2e%2e|%252e%252e|/etc/passwd|windows/system32|boot\.ini)"

# 1004: CORS Origin protection for sensitive current-account/profile endpoints.
SecRule REQUEST_URI "@rx (?i)^/(?:accountDetails|api/accountDetails|api/user/me|api/profile|api/auth/me)(?:$|[/?])" \
    "id:1004,phase:1,deny,status:403,log,msg:'Blocked suspicious CORS Origin',chain"
    SecRule &REQUEST_HEADERS:Origin "@gt 0" "chain"
    SecRule REQUEST_HEADERS:Origin "!@streq https://localhost:5173"

# 1006/1007: ModSecurity login attempt counter. Nginx limit_req is the primary
# brute-force control and returns 429; this collection is defense-in-depth.
SecRule REQUEST_URI "@rx (?i)^/(?:api/auth/login|api/admin/auth/login)(?:$|[/?])" \
    "id:1006,phase:1,pass,nolog,setvar:ip.sentinel_login_attempts=+1,expirevar:ip.sentinel_login_attempts=60"

SecRule REQUEST_URI "@rx (?i)^/(?:api/auth/login|api/admin/auth/login)(?:$|[/?])" \
    "id:1007,phase:1,deny,status:429,log,msg:'Blocked brute force login attempts',chain"
    SecRule IP:SENTINEL_LOGIN_ATTEMPTS "@gt 10"

# 1008: Demo-level profile ID manipulation guard.
# Real IDOR protection must remain enforced in backend authorization and
# ownership checks. The WAF only blocks obvious arbitrary id parameters.
SecRule REQUEST_URI "@rx (?i)^/(?:api/profile|profile)(?:$|[/?])" \
    "id:1008,phase:2,deny,status:403,log,msg:'Blocked suspicious profile ID manipulation',chain"
    SecRule &ARGS:id "@gt 0"
