load_module modules/ngx_http_modsecurity_module.so;

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    access_log /dev/stdout;

    limit_req_zone $binary_remote_addr zone=sentinel_login_rate:10m rate=5r/m;
    limit_req_status 429;

    upstream sentinel_backend {
        server backend:5000;
    }

    server {
        listen 8081 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/localhost.pem;
        ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        modsecurity on;
        modsecurity_rules_file /etc/nginx/modsecurity/main.conf;

        error_page 403 = @waf_403;
        error_page 429 = @waf_429;

        location = /waf-health {
            modsecurity off;
            return 204;
        }

        location @waf_403 {
            internal;
            default_type text/plain;
            return 403 "Forbidden\n";
        }

        location @waf_429 {
            internal;
            default_type text/plain;
            return 429 "Too Many Requests\n";
        }

        location ~ ^/(api/auth/login|api/admin/auth/login)$ {
            limit_req zone=sentinel_login_rate burst=5 nodelay;
            proxy_pass https://sentinel_backend;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            proxy_pass https://sentinel_backend;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
