services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentinel-ai-backend:local
    env_file:
      - .env
    ports:
      - "5000:5000"
    environment:
      PCAP_RUN_FOLDER: /app/Backend/pcap_runs
      LOCAL_PCAP_ALLOWED_ROOT: /app/Backend/pcap_runs
      HTTPS_ENABLED: "true"
      SSL_CERT_FILE: certs/localhost.pem
      SSL_KEY_FILE: certs/localhost-key.pem
      WAF_BASE_URL: https://nginx-waf:8081
    volumes:
      - backend-instance:/app/Backend/instance
      - backend-logs:/app/Backend/logs
      - backend-pcap-runs:/app/Backend/pcap_runs
      - backend-uploads:/app/upload
      - ./certs:/app/certs:ro

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-support@example.com}
    image: sentinel-ai-frontend:local
    ports:
      - "3000:80"
    depends_on:
      - backend

  nginx-waf:
    image: owasp/modsecurity-crs:nginx-alpine
    entrypoint: ["nginx", "-g", "daemon off;"]
    ports:
      - "8081:8081"
    depends_on:
      - backend
    volumes:
      - ./waf/nginx.docker.conf:/etc/nginx/nginx.conf:ro
      - ./waf/modsecurity:/etc/nginx/modsecurity:ro
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1:8081/waf-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  backend-instance:
  backend-logs:
  backend-pcap-runs:
  backend-uploads:
